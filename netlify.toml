[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.14"

# The Blox designer embeds this client-only route in an iframe; it is not
# prerendered, so serve the app shell.
[[redirects]]
  from = "/_blox_preview"
  to = "/index.html"
  status = 200
